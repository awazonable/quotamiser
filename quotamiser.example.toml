# QuotaMiser configuration. Copy to `quotamiser.toml` and edit.
#
# Credentials are never written here: the file names the environment variables
# that carry them. A `.env` file beside this one is read at startup for any
# that are not already set in the environment.
#
# Unknown keys stop startup rather than being ignored.

[server]
# Loopback only. There is no authentication, so this must not be reachable
# from the network.
bind = "127.0.0.1:8787"

[upstream]
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
# Read-only, and used only for the Usage API: recovering a day's consumption
# and checking that traffic is still served from the free grant.
admin_key_env = "OPENAI_ADMIN_KEY"
# The data-sharing project, when the organization has more than one.
# project = "proj_..."
connect_timeout_seconds = 10
read_timeout_seconds = 120

[ledger]
path = "state/ledger.db"
# MUST be on a different volume from `path`: the external record is what tells
# a restored ledger from an intact one, and a volume that loses one would
# otherwise lose both.
external_record_path = "D:/quotamiser/external/hwm"
lock_dir = "state/locks"
# The organization whose grant this ledger is the inventory for. QuotaMiser
# assumes it is the only thing spending that organization's grant.
organization = "org-REPLACE-ME"
# Test machines with a single volume only. This voids the guarantee above.
# allow_same_volume_external_record = true

# Daily grants. Tier 1 data sharing: 250,000 across the large models and
# 2,500,000 across the small ones. Check your own tier before trusting these.
[[pool]]
id = "openai:large"
granted_per_day = 250000

[[pool]]
id = "openai:small"
granted_per_day = 2500000

# Every model QuotaMiser will serve, with the pool it draws on and the most it
# can emit. A request that names no cap of its own reserves `max_output_tokens`,
# so an understated value here would break the guarantee.
[[model]]
id = "gpt-5.6-terra"
pool = "openai:small"
max_output_tokens = 128000
# Only for a model whose encoding is known to cover all 256 byte values, which
# lets a flat text request skip the provider's counter. GPT-5.6's encoding is
# unpublished, so it stays false.
byte_level_encoding_known = false

[[model]]
id = "gpt-5.6-luna"
pool = "openai:small"
max_output_tokens = 128000

[[model]]
id = "gpt-5.6-sol"
pool = "openai:large"
max_output_tokens = 128000

[clock]
# The day boundary is decided from the provider's clock, never the local one.
reading_uncertainty_seconds = 5
# The next day's pool is never opened sooner than this after the reset.
open_delay_seconds = 300
max_reading_age_seconds = 900
refresh_seconds = 120

[safety]
# How long a data-sharing check stands before admission refuses everything.
data_sharing_ttl_seconds = 900
# The liability one verification may cover, as a fraction of the day's grant.
liability_budget_divisor = 4
