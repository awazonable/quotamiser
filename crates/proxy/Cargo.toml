[package]
name = "quotamiser-proxy"
version = "0.1.0"
description = "The QuotaMiser HTTP proxy: ingress, dispatch, supervision and settlement."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
bytes = "1.12.1"
httpdate = "1.0.3"
quotamiser-admission = { version = "0.1.0", path = "../admission" }
quotamiser-ledger = { version = "0.1.0", path = "../ledger" }
quotamiser-protocol = { version = "0.1.0", path = "../protocol" }
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
